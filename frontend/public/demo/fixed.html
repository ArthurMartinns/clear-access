<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitrine de demonstração — corrigida</title>
    <link rel="stylesheet" href="/demo/demo.css" />
  </head>
  <body>
    <header><a href="/">ClearAccess</a></header>
    <main>
      <h1>Vitrine de demonstração</h1>
      <p>Esta versão corrige os problemas intencionais da página de teste.</p>
      <img src="/demo/scene.svg" alt="Ilustração de montanhas verdes sob o sol" />
      <section class="panel" aria-labelledby="news-title">
        <h2 id="news-title">Receba novidades</h2>
        <p class="muted">Uma mensagem ocasional sobre acessibilidade.</p>
        <div class="field">
          <label for="email">Seu e-mail</label>
          <input id="email" type="email" autocomplete="email" />
          <button type="button">Cadastrar</button>
        </div>
      </section>
    </main>
  </body>
</html>
